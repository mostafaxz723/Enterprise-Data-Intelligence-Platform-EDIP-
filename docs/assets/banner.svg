<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Egypt Live Renewable Energy Atlas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b24"/><stop offset="0.6" stop-color="#0c3f4b"/><stop offset="1" stop-color="#0b5d6b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e8a317"/>
    </radialGradient>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L45 0 L60 26 L45 52 L15 52 L0 26 Z" fill="none" stroke="#1fb5c9" stroke-opacity="0.13" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#hex)"/>
  <!-- sun -->
  <g transform="translate(1010 105)">
    <g stroke="#ffd76a" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-78" x2="0" y2="-62"/><line x1="0" y1="62" x2="0" y2="78"/>
      <line x1="-78" y1="0" x2="-62" y2="0"/><line x1="62" y1="0" x2="78" y2="0"/>
      <line x1="-55" y1="-55" x2="-44" y2="-44"/><line x1="44" y1="44" x2="55" y2="55"/>
      <line x1="55" y1="-55" x2="44" y2="-44"/><line x1="-44" y1="44" x2="-55" y2="55"/>
    </g>
    <circle r="46" fill="url(#sun)"/>
  </g>
  <!-- wind turbines -->
  <g stroke="#e8f1f4" stroke-linecap="round" fill="none">
    <g transform="translate(1110 180)"><line x1="0" y1="0" x2="0" y2="140" stroke-width="5"/>
      <g stroke-width="5"><line x1="0" y1="0" x2="0" y2="-62"/><line x1="0" y1="0" x2="54" y2="31"/><line x1="0" y1="0" x2="-54" y2="31"/></g></g>
    <g transform="translate(1160 215)" opacity="0.7"><line x1="0" y1="0" x2="0" y2="105" stroke-width="4"/>
      <g stroke-width="4"><line x1="0" y1="0" x2="12" y2="-44"/><line x1="0" y1="0" x2="40" y2="24"/><line x1="0" y1="0" x2="-30" y2="32"/></g></g>
  </g>
  <!-- solar panels -->
  <g fill="#1b3a73" stroke="#7fb6ff" stroke-width="1.5">
    <polygon points="820,300 890,300 905,262 835,262"/><polygon points="905,300 975,300 990,262 920,262"/>
    <polygon points="990,300 1060,300 1075,262 1005,262"/>
  </g>
  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#e8f1f4">
    <text x="60" y="118" font-size="54" font-weight="800">Egypt Live</text>
    <text x="60" y="180" font-size="54" font-weight="800" fill="#e8a317">Renewable Energy Atlas</text>
    <text x="60" y="226" font-size="22" fill="#9db4bd">Where to build solar &amp; wind in Egypt, how much it will produce, and what can go wrong.</text>
    <text x="60" y="272" font-size="24" fill="#1fb5c9" direction="rtl" text-anchor="start">أطلس الطاقة المتجددة الحي لمصر</text>
  </g>
</svg>
