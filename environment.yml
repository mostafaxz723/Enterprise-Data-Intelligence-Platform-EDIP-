  - statsmodels
  - xgboost
  - lightgbm
  - shap
  - optuna
  - mlflow
  # --- viz
  - matplotlib
  - seaborn
  - plotly
  - altair
  - pydeck
  - streamlit
  # --- api
  - fastapi
  - uvicorn
  - pydantic
  - python-multipart
  - orjson
  - redis-py
  # --- dev
  - jupyterlab
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-cov
  - ruff
  - black
