  - leafmap
  - folium
  - geemap
  - pystac-client
  # --- climate / arrays
  - xarray
  - netcdf4
  - h5netcdf
  - cfgrib
  - eccodes
  - dask
  - zarr
  # --- energy
  - pvlib-python
  # --- data
  - pandas
  - numpy
  - scipy
  - polars
  - duckdb
  - pyarrow
  - sqlalchemy
  - psycopg2
  - geoalchemy2
  - alembic
  - pandera
  - pyyaml
  - requests
  - boto3
  - s3fs
  - jinja2
  - networkx
  - rtree
  - openpyxl
  - reportlab
  - pydantic-settings
