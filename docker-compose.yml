# ==============================================================================
# Egypt Live Renewable Energy Atlas - local data-engineering stack (zero cost, all free)
# Nothing heavy starts by default. Only PostGIS starts with `docker compose up -d`.
# Pick extra groups with profiles:
#   docker compose --profile airflow up -d
#   docker compose --profile airflow --profile cache --profile storage up -d
# Stop everything:   docker compose --profile "*" stop
# Remove containers: docker compose --profile "*" down      (volumes/data are kept)
# Remove ALSO data:  docker compose --profile "*" down -v   (DANGER)
# ==============================================================================
name: egypt-energy

x-airflow-common: &airflow-common
  build: ./infra/docker/airflow
  image: egy-airflow:2.8.1
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-only-change-me}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    GIS_DB_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@postgis:5432/${POSTGRES_DB:-egypt_energy}
    PYTHONPATH: /opt/airflow
  volumes:
    - ./data_engineering/dags:/opt/airflow/dags
    - ./infra/airflow/logs:/opt/airflow/logs
    - ./infra/airflow/plugins:/opt/airflow/plugins
    - ./data_engineering:/opt/airflow/data_engineering
    - ./engine:/opt/airflow/engine
  profiles: ["airflow"]

services:
  # ---------------------------------------------------------------- default ---
  postgis:
    image: postgis/postgis:16-3.4
    container_name: egypt-energy_postgis_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
      POSTGRES_DB: ${POSTGRES_DB:-egypt_energy}
    ports: ["5433:5432"]
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/docker/postgis/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-egypt_energy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------ profile: vectors -----
  pgvector:   # for the chatbot's vector search (kept separate from PostGIS on purpose)
    image: pgvector/pgvector:pg16
    container_name: egy_pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
      POSTGRES_DB: ${POSTGRES_DB:-egypt_energy}
    ports: ["5434:5432"]
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./infra/docker/pgvector/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-egypt_energy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["vectors"]

  # ---------------------------------------------------- profile: airflow ------
  airflow-postgres:
    image: postgres:15-alpine
    container_name: egypt-energy_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes: ["airflow_pg_data:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["airflow"]

  airflow-init:
    <<: *airflow-common
    container_name: egypt-energy_airflow_init
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      airflow-postgres: { condition: service_healthy }

  airflow-webserver:
    <<: *airflow-common
    container_name: egypt-energy_airflow_webserver
    command: webserver
    ports: ["8080:8080"]
    mem_limit: 2g
    depends_on:
      airflow-postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
      postgis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: egypt-energy_airflow_scheduler
    command: scheduler
    mem_limit: 2g
    depends_on:
      airflow-postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
      postgis: { condition: service_healthy }
    restart: unless-stopped

  # ------------------------------------------------------ profile: cache ------
  redis:
    image: redis:7-alpine
    container_name: egypt-energy_redis_cache
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    mem_limit: 192m
    restart: unless-stopped
    profiles: ["cache"]

  # --------------------------------------------------- profile: streaming -----
  kafka:
    image: apache/kafka:3.7.0
    container_name: egypt-energy_kafka_broker
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1g
    restart: unless-stopped
    profiles: ["streaming"]

  # --------------------------------------------------- profile: monitoring ----
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: egypt-energy_prometheus_monitoring
    ports: ["9090:9090"]
    volumes: ["prometheus_data:/prometheus"]
    mem_limit: 512m
    restart: unless-stopped
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.3.3
    container_name: egypt-energy_grafana_dashboards
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: ["grafana_data:/var/lib/grafana"]
    mem_limit: 512m
    depends_on: [prometheus]
    restart: unless-stopped
    profiles: ["monitoring"]

  # ---------------------------------------------------------- profile: bi -----
  metabase:   # no-code dashboards for non-technical users (free open-source edition)
    image: metabase/metabase:latest
    container_name: egypt-energy_metabase_bi
    ports: ["3002:3000"]
    environment:
      JAVA_OPTS: "-Xmx1g"
      MB_DB_FILE: /metabase-data/metabase.db
    volumes: ["metabase_data:/metabase-data"]
    mem_limit: 1536m
    restart: unless-stopped
    profiles: ["bi"]

  # ---------------------------------------------------------- profile: ml -----
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: egypt-energy_mlflow_tracking
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
    mem_limit: 512m
    restart: unless-stopped
    profiles: ["ml"]

  # ------------------------------------------------------- profile: tiles -----
  martin:   # serves PostGIS tables as vector tiles straight to MapLibre
    image: ghcr.io/maplibre/martin:latest
    container_name: egypt-energy_martin_tiles
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@postgis:5432/${POSTGRES_DB:-egypt_energy}
    ports: ["3003:3000"]
    mem_limit: 256m
    depends_on:
      postgis: { condition: service_healthy }
    restart: unless-stopped
    profiles: ["tiles"]

  # ------------------------------------------------ profile: app (our API) ----
  api:
    build: ./infra/docker/api
    image: egy-api:dev
    container_name: egypt-energy_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      GIS_DB_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@postgis:5432/${POSTGRES_DB:-egypt_energy}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      DOCS_DIR: /srv/docs
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PYTHONPATH: /srv
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    volumes:
      - ./api:/srv/api
      - ./assistant:/srv/assistant
      - ./engine:/srv/engine
      - ./docs:/srv/docs
      - ./data_engineering/config:/srv/data_engineering/config
    mem_limit: 512m
    depends_on:
      postgis: { condition: service_healthy }
    profiles: ["app"]

  # ------------------------------------- profile: dbt (run on demand only) ----
  dbt:   # usage: docker compose run --rm dbt run
    build: ./infra/docker/dbt
    image: egy-dbt:dev
    container_name: egypt-energy_dbt
    entrypoint: ["dbt"]
    command: ["--version"]
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
      POSTGRES_DB: ${POSTGRES_DB:-egypt_energy}
    volumes: ["./data_engineering/warehouse:/usr/app"]
    depends_on:
      postgis: { condition: service_healthy }
    profiles: ["dbt"]

  # ------------------------------------------------ extras for other projects --
  mongo:
    image: mongo:7
    container_name: egypt-energy_mongo_db
    ports: ["27018:27017"]      # 27018 on your PC so it never clashes with a native MongoDB
    volumes: ["mongo_data:/data/db"]
    mem_limit: 512m
    restart: unless-stopped
    profiles: ["nosql"]

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: egypt-energy_clickhouse_olap
    ports: ["8123:8123", "9010:9000"]
    volumes: ["clickhouse_data:/var/lib/clickhouse"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 1g
    restart: unless-stopped
    profiles: ["olap"]

volumes:
  postgis_data:
  pgvector_data:
  airflow_pg_data:
  prometheus_data:
  grafana_data:
  metabase_data:
  mlflow_data:
  mongo_data:
  clickhouse_data:
